worker_processes 1;
events { worker_connections 1024; }
http {
    # Resolve physical slot names at request time, including after a cold boot.
    resolver 127.0.0.11 ipv6=off valid=1s;
    resolver_timeout 5s;
    # Only the configured shared-proxy network may supply client identity/scheme.
    include /etc/nginx/active/trusted-proxies.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    map "$trusted_ingress:$http_x_forwarded_proto" $forwarded_proto {
        default $scheme;
        "1:https" https;
        "1:http" http;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 3000;
        client_max_body_size 0;
        location / {
            include /etc/nginx/active/target.conf;
            set $production $deployment_slot:3000;
            proxy_pass http://$production;
            proxy_hide_header X-New-API-Slot;
            add_header X-New-API-Slot $deployment_slot always;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # Never replay an inference request at the gateway.
            proxy_next_upstream off;
        }
    }
}
